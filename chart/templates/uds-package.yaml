apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: #TEMPLATE_APPLICATION_NAME#
  namespace: {{ .Release.Namespace }}
spec:
  # Customize network policies and expose services via istio
  network:
    serviceMesh:
      mode: ambient
    expose:
      - service: #TEMPLATE_APPLICATION_NAME#
        podLabels:
          app: #TEMPLATE_APPLICATION_NAME#
        gateway: tenant
        host: #TEMPLATE_APPLICATION_NAME#
        port: 1234
        uptime:
          checks:
            paths:
              - /
    allow:
      - direction: Ingress
        remoteGenerated: IntraNamespace

      - direction: Egress
        remoteGenerated: IntraNamespace

      # Custom rules for unanticipated scenarios
      {{- with .Values.additionalNetworkAllow }}
      {{ toYaml . | nindent 6 }}
      {{- end }}
