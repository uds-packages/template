includes:
  - test: ./tasks/test.yaml
  - create: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/create.yaml
  - lint: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/lint.yaml
  - pull: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/pull.yaml
  - deploy: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/deploy.yaml
  - setup: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/setup.yaml
  - actions: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/actions.yaml
  - upgrade: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/upgrade.yaml
  - publish: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/publish.yaml

variables:
  - name: NEXT_MODE
    default: "true"

tasks:
  - name: default
    description: Setup k3d cluster, deploy package
    actions:
      - task: create-dev-package
      - task: setup:k3d-test-cluster
      - task: create-deploy-test-bundle

  - name: create-dev-package
    description: Create the package
    actions:
      - task: create:package
        with:
          options: "--skip-sbom"

  - name: create-deploy-test-bundle
    description: Test and validate cluster is deployed with the package
    actions:
      - task: create:test-bundle
      - task: deploy:test-bundle
      - task: setup:keycloak-user
      - task: test:all

  - name: dev
    description: Create and deploy the bundle on an existing cluster (for iteration/dev speed)
    actions:
      - task: create-dev-package
      - task: create:test-bundle
      - task: deploy:test-bundle

#### Template CI: Remove this block and all ci-setup / ci-test-values calls when building a package ####
  - name: ci-setup
    description: Populate template with podinfo values for CI validation
    actions:
      - cmd: |
          set -e

          APP_NAME="podinfo"
          DISPLAY_NAME="Podinfo"
          CHART_URL="oci://ghcr.io/stefanprodan/charts/podinfo"
          CHART_VERSION="6.7.1"
          APP_IMAGE="ghcr.io/stefanprodan/podinfo:6.7.1"
          APP_PORT="9898"
          COPYRIGHT_YEAR="$(date -u +%Y)"

          # Replace template placeholders across files
          find . -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.hcl" -o -name "*.ts" -o -name "*.json" -o -name "*.md" \) \
            -not -path "./.git/*" -not -path "*/node_modules/*" -print0 | \
            xargs -0 perl -pi -e "
              s/#TEMPLATE_COPYRIGHT_YEAR#/${COPYRIGHT_YEAR}/g;
              s/#TEMPLATE_APPLICATION_NAME#/${APP_NAME}/g;
              s/#TEMPLATE_APPLICATION_DISPLAY_NAME#/${DISPLAY_NAME}/g;
              s/#TEMPLATE_APPLICATION_PORT#/${APP_PORT}/g;
              s|#TEMPLATE_CHART_REPO#|${CHART_URL}|g;
              s|#UDS_PACKAGE_REPO#|https://github.com/stefanprodan/podinfo|g;
            "

          # Patch common/zarf.yaml
          ./zarf tools yq -i ".components[0].charts[1].version = \"${CHART_VERSION}\"" common/zarf.yaml
          ./zarf tools yq -i 'del(.components[0].charts[1].gitPath)' common/zarf.yaml
          ./zarf tools yq -i '.components[0].charts[1].values[0].excludePaths |= (. + [".podinfo.redis", ".podinfo.serviceAccount.imagePullSecrets"] | unique)' common/zarf.yaml

          # Patch zarf.yaml, set podinfo image
          ./zarf tools yq -i "(.components[] | select(.only.flavor == \"upstream\")).images = [\"${APP_IMAGE}\"]" zarf.yaml
          ./zarf tools yq -i 'del(.components[] | select(.only.flavor == "unicorn"))' zarf.yaml
          ./zarf tools yq -i 'del(.components[] | select(.only.flavor == "registry1"))' zarf.yaml
          ./zarf tools yq -i '.variables = [{"name": "DOMAIN", "default": "uds.dev"}]' zarf.yaml

          ./zarf tools yq -i '.podinfo.replicaCount = 2 | ."uds-podinfo-config".additionalNetworkAllow = [{"direction": "Egress", "remoteNamespace": "kube-system", "remoteSelector": {"k8s-app": "kube-dns"}, "port": 53, "protocol": "UDP", "description": "Template values passthrough test"}]' bundle/values/application.yaml

          # Patch uds-package.yaml: add SSO + Authservice (podinfo has no native OIDC), allow-all network policy
          perl -i -0pe 's|(  # Customize network policies and expose services via istio)|  sso:\n    - name: Podinfo\n      clientId: uds-podinfo\n      redirectUris:\n        - "https://podinfo.uds.dev/login"\n      enableAuthserviceSelector:\n        app.kubernetes.io/name: podinfo\n$1|' chart/templates/uds-package.yaml
          perl -pi -e 's/remoteGenerated: IntraNamespace/remoteGenerated: Anywhere/g' chart/templates/uds-package.yaml

          # Point auth.setup.ts at the root path (Authservice intercepts all routes)
          perl -pi -e 's|/example/endpoint|/|g' tests/auth.setup.ts

          # Rename template test file
          mv tests/template-application-name.test.ts "tests/${APP_NAME}.test.ts" 2>/dev/null || true

          echo "CI setup complete: template populated with ${APP_NAME} values"

      - task: lint:values-generate

  - name: ci-test-values
    description: Verify the template CI values reached both charts
    actions:
      - cmd: ./zarf tools kubectl get deployment podinfo -n podinfo -o json | ./zarf tools yq -e '.spec.replicas == 2'
      - cmd: >-
          ./zarf tools kubectl get packages.uds.dev podinfo -n podinfo -o json |
          ./zarf tools yq -e '.spec.network.allow | any_c(.description == "Template values passthrough test" and .direction == "Egress" and .remoteNamespace == "kube-system" and .remoteSelector."k8s-app" == "kube-dns" and .port == 53 and .protocol == "UDP")'

#### Template CI: Remove this block and all ci-setup / ci-test-values calls when building a package ####

# CI will execute the following (via uds-common/.github/workflows/callable-test.yaml) so they need to be here with these names
  - name: test-install
    description: Test deploying the current branch to a new cluster
    actions:
      - task: ci-setup # remove this when building a package
      - task: create-dev-package
      - task: setup:k3d-test-cluster
      - task: create-deploy-test-bundle
      - task: ci-test-values # remove this when building a package

  - name: test-upgrade
    description: Test an upgrade from the latest released package to the current branch
    actions:
      - task: upgrade:create-latest-tag-bundle
      - task: setup:k3d-test-cluster
      - task: deploy:test-bundle
      - task: create-dev-package
      - task: create-deploy-test-bundle
      - task: ci-test-values # remove this when building a package

  - name: publish-package
    description: Build and publish the packages
    actions:
      - description: Create the package
        task: create:package

      - description: Setup the cluster
        task: setup:k3d-test-cluster

      - description: Create deploy and test the bundle
        task: create-deploy-test-bundle

      - description: Publish the packages
        task: publish:package
